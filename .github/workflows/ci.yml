name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      netlab:
        description: Run the Docker network lab
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: gofmt
        run: test -z "$(gofmt -l core services agents tests)"
      - name: vet
        run: make vet
      - name: test (race)
        env:
          PRW_REQUIRE_DB: "1"   # database tests must run, never skip
        run: make test-race
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for m in core/prwcore services/control agents/host tests; do (cd $m && govulncheck ./...); done

  mobile-spike:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
      - name: analyze and test
        run: make spike-app

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  netlab:
    if: github.event_name == 'workflow_dispatch' && inputs.netlab
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - name: network lab
        run: make netlab
