# HTTPS-only egress proxy: CONNECT to port 443 of the lab API host only.
http_port 3128
acl ssl_ports port 443
acl CONNECT method CONNECT
acl lab_api dstdomain api.lab.invalid
http_access deny CONNECT !ssl_ports
http_access allow CONNECT lab_api
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
