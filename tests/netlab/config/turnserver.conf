# coturn for the network lab. Mirrors the production hardening, except that
# peers live in private lab ranges, so only the lab WAN is allowed as a peer.
listening-ip=10.99.0.20
relay-ip=10.99.0.20
listening-port=3478
tls-listening-port=443
min-port=49160
max-port=49200
realm=lab.invalid
fingerprint
use-auth-secret
static-auth-secret=TEST-ONLY-netlab-turn-secret
cert=/lab/certs/turn.crt
pkey=/lab/certs/turn.key
no-tlsv1
no-tlsv1_1
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=10.99.0.0-10.99.0.255
total-quota=100
user-quota=12
max-bps=2000000
log-file=stdout
simple-log
